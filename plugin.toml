id = "jrust.openidea"
name = "jrust"
version = "0.3.0"
description = "jrust 语言支持：语法高亮、新建项目、按文件运行、DAP 调试"
authors = ["jrust contributors"]
license = "MIT"
engines.openidea = "^1.10"
wasm = "dist/plugin.wasm"
activation = ["on-language:jrust"]

[capabilities]
required = ["project.read", "process:jrust"]

[[contributes.languages]]
path = "languages/jrust.toml"

# 工具菜单里的“新建 jrust 项目…”，也是查找操作（Ctrl+Shift+A）的一项。
# 新建项目向导的目录是 IDE 内置表，插件无法扩展，所以入口放在菜单里。
[[contributes.commands]]
id = "new-project"
title = "jrust: 新建项目…"
category = "jrust"

[[contributes.menus]]
menu = "tools"
command = "new-project"

# 文件 › 新建 › 文件… 里的 “jrust Class” 模板，类名取自文件名（$NAME$）。
[[contributes.fileTemplates]]
id = "jrust-class"
name = "jrust Class"
extension = "jrust"
path = "templates/Main.jrust"

# 项目根目录存在 main.jrust（单文件项目）或 Cargo.toml（jrust 编译器仓库）时，
# 才调用 launch-configurations 导出，为项目内每个 .jrust 文件生成一条配置。
[[contributes.runConfigurations]]
files = ["main.jrust", "Cargo.toml"]
