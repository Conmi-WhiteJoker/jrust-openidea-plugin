id = "jrust.openidea"
name = "jrust"
version = "0.1.0"
description = "jrust 语言支持：语法高亮、按文件运行、DAP 调试"
authors = ["jrust contributors"]
license = "MIT"
engines.openidea = "^1.10"
wasm = "dist/plugin.wasm"
activation = ["on-language:jrust"]

[capabilities]
required = ["project.read", "process:jrust"]

[[contributes.languages]]
path = "languages/jrust.toml"

# 项目根目录存在 main.jrust（单文件项目）或 Cargo.toml（jrust 编译器仓库）时，
# 才调用 launch-configurations 导出，为项目内每个 .jrust 文件生成一条配置。
[[contributes.runConfigurations]]
files = ["main.jrust", "Cargo.toml"]
