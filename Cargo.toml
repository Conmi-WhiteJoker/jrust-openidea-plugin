[package]
name = "jrust-openidea-plugin"
version = "0.2.0"
edition = "2021"
description = "jrust 的 OpenIDEA 插件：语言注册、运行配置与 DAP 调试"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 与 OpenIDEA 0.1.51（插件 API 1.15）对应的 SDK。
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.51" }

[profile.release]
opt-level = "s"
lto = true
strip = true
